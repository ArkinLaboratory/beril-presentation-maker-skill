####################################################################
# beril-presentation-maker-skill — pyproject.toml
#
# Status: v0.3.5.1 — bash strict-mode patch in should_run() resume
# logic. Hub smoke run on ibd_phage_targeting (KBERDL JupyterHub,
# 2026-05-05 evening) surfaced TWO bugs in succession:
#
#   (A) gate_throughline_pick blocks on `read -r pick </dev/tty`,
#       which fails in TTY-less contexts (Claude Code background
#       Bash tool, CI, daemon). Architectural — synchronous-blocking-
#       on-TTY model assumes interactive terminal, which is wrong for
#       hub agents. Workaround for Thursday: --auto-advance auto-
#       picks TL1. Real fix (state-driven continue with --pick TLN
#       gate-resume, paper-writer pattern) tracked for v0.4.0; not
#       safe to land in 36 hours pre-event.
#
#   (B) should_run() declares `local order_resume order_stage`
#       without initialization. Under bash 5.2 `set -u`, the
#       `[[ -z "$order_resume" ]]` check after the case loop trips
#       "unbound variable" if neither arm matched. Hidden until now
#       because most prior tests run without --resume-from (which
#       short-circuits before the loop). Hub agent hit it on first
#       `continue --resume-from throughline`. Fix shipped in this
#       version: `local order_resume="" order_stage=""`.
#
# Bug A is documented in TUTORIAL.md / PARTICIPANT-RUNBOOK.md as the
# --auto-advance workaround for May 7 participants. Bug B is fixed
# in source. No new tests for the strict-mode case (it's a one-line
# init that any future invocation of the resume codepath would
# re-validate); the live hub run is the regression evidence.
####################################################################

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ----------------------------------------------------------------------
# Project metadata
# ----------------------------------------------------------------------

[project]
name = "beril-presentation-maker-skill"
version = "0.3.5.1"
description = "BERIL Presentation Maker — drafts beautiful, evidence-grounded scientific presentations (talks + posters) from BERDL analysis projects, in KBase brand. Distributed as a Claude Code skill."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Arkin Laboratory", email = "aparkin@lbl.gov"},
]

license = {text = "MIT"}

keywords = [
    "bioinformatics",
    "claude-code",
    "beril",
    "kbase",
    "research-observatory",
    "scientific-presentations",
    "slide-generation",
    "talks",
    "posters",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    # Prevents accidental `twine upload` while repo is private.
    # Remove when going public on PyPI.
    "Private :: Do Not Upload",
]

# ----------------------------------------------------------------------
# Runtime dependencies
# ----------------------------------------------------------------------
#
# Pure-Python deps for the assemble step (slides + posters). The
# stdlib carries everything else (install, configure, state-diff,
# validators, figure curation): argparse, pathlib, shutil, subprocess,
# importlib.resources, hashlib, json, os, re.
#
# Decision history: see DECISIONS.md.
#   - python-pptx: pure Python .pptx writer (mirrors paper-writer's
#     python-docx choice). Pulls lxml transitively as a precompiled
#     wheel; pipx-installable on every platform we care about. No
#     system pandoc / LibreOffice required.
#   - nbformat: notebook AST extraction for figure-source provenance
#     and methods-summary grounding. Same as paper-writer.
#   - Pillow: raster image inspection for figure validators (P6:
#     resolution at 1080p, contrast checks). Standard wheel.
#   - requests: HTTP for the optional CBORG image-gen client. Stdlib
#     urllib works but requests gives us cleaner timeout/retry. Light.

dependencies = [
    "python-pptx>=0.6.23",
    "nbformat>=5.7.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

# ----------------------------------------------------------------------
# Optional dependencies (extras)
# ----------------------------------------------------------------------

[project.optional-dependencies]

# AI-image-gen extra — pulls in nothing extra at the moment; the CBORG
# client uses requests. Reserved for v0.2 if we add Google AI Studio
# direct or OpenAI direct as alternative providers.
ai-diagrams = []

# Optional Mermaid → PNG render via mermaid-cli (npm dep, not pip).
# Documented in SPEC §8.3; not a Python dep.

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

# ----------------------------------------------------------------------
# Console scripts
# ----------------------------------------------------------------------

[project.scripts]
beril-presentation-maker = "beril_presentation_maker.cli:main"

# Planned subcommands (per LAYOUT.md):
#   beril-presentation-maker install-skill <BERIL_ROOT>
#   beril-presentation-maker configure
#   beril-presentation-maker continue <draft_dir>
#   beril-presentation-maker assemble <draft_dir> [--format pptx|pdf]
#
# The drafting and review-rewrite paths are NOT Python subcommands —
# they're handled by the planned shipped shell script
# tools/presentation_maker.sh (which the slash command will invoke
# directly). Same pattern as beril-paper-writer / beril-adversarial.

# ----------------------------------------------------------------------
# URLs
# ----------------------------------------------------------------------

[project.urls]
Homepage = "https://github.com/ArkinLaboratory/beril-presentation-maker-skill"
Issues = "https://github.com/ArkinLaboratory/beril-presentation-maker-skill/issues"
Repository = "https://github.com/ArkinLaboratory/beril-presentation-maker-skill.git"

# ----------------------------------------------------------------------
# Build configuration
# ----------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/beril_presentation_maker"]

# Defense-in-depth excludes for the wheel target. Hatchling excludes
# bytecode by default, but we list these explicitly so editable installs
# with `pip install -e .` and direct wheel builds match.
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
    "**/.pytest_cache",
    "**/pytest-cache-files-*",
    # State directories never ship.
    "src/beril_presentation_maker/skill/state",
    # The smoke-named copy of the orchestrator (kept until git rm).
    # Only the production-named presentation_maker.sh ships.
    "src/beril_presentation_maker/skill/tools/presentation_maker_smoke.sh",
]

# The shipped skill directory (SKILL.md, prompts, references, tools,
# templates) lives inside the package at src/beril_presentation_maker/skill/
# and ships as package data. Accessed at runtime via importlib.resources.
# Hatchling auto-includes non-.py files in the package; the shell
# script's executable bit is preserved through wheel metadata.
#
# The KBase-branded master template (.pptx) and poster templates
# (horizontal/vertical .pptx) ship under skill/references/templates/
# as binary package data. See LAYOUT.md §5.
#
# v0.1.0-spec: skill/ tree is a stub. Full content lands with
# implementation.

[tool.hatch.build.targets.sdist]
include = [
    "src/beril_presentation_maker",
    "tests",
    "README.md",
    "SPEC.md",
    "LAYOUT.md",
    "DECISIONS.md",
    "reference",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
    "**/.pytest_cache",
    "**/pytest-cache-files-*",
    # State directories never ship.
    "src/beril_presentation_maker/skill/state",
    # Per-draft runtime state never ships either.
    "talks/draft_*/state.json",
    "talks/draft_*/audit",
    "talks/cost-log.jsonl",
    # Until git rm, the smoke-named orchestrator copy is on-disk but
    # excluded from sdist + wheel.
    "src/beril_presentation_maker/skill/tools/presentation_maker_smoke.sh",
]

# ----------------------------------------------------------------------
# Tool configurations
# ----------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests that hit live LLM CLIs (deselect with '-m \"not integration\"')",
    "slow: marks tests that take >5s",
    "image_gen: marks tests that call CBORG image-gen API (cost; deselect with '-m \"not image_gen\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
]
